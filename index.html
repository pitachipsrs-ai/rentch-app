    <script>
      // Self-healing boot script for Telegram Mini App & mobile browsers:
      // 1. Immediately signal Telegram WebApp ready() so Telegram never times out on the "Open / ОТКРЫТЬ" button
      // 2. Unregister any stale Service Workers / Workbox caches that could serve outdated JS chunks
      // 3. Auto-reload with cache-buster if a cached HTML references an old JS bundle after server update
      (function () {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
        } catch (e) {}

        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              var src = target.src || target.href || '';
              if (src.indexOf('/assets/') !== -1 && !sessionStorage.getItem('rentch_chunk_reloaded')) {
                sessionStorage.setItem('rentch_chunk_reloaded', '1');
                var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
                window.location.replace(window.location.pathname + sep + '_v=' + Date.now() + window.location.hash);
              }
            }
          },
          true
        );
      })();
    </script>
